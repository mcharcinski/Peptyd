<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HexaLabs - Panel CRM</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --surface-color: #141414;
            --gold: #D4AF37;
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --danger: #ff4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); }
        
        #login-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
        }
        .login-box {
            background: var(--surface-color); padding: 3rem; border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 4px; text-align: center; width: 100%; max-width: 400px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
        }
        .login-box input {
            width: 100%; padding: 12px; margin-bottom: 1.2rem; background: #000; border: 1px solid #333; color: #fff; outline: none;
        }
        .login-box input:focus { border-color: var(--gold); }
        
        .login-box button {
            width: 100%; padding: 14px; background: var(--gold); color: #000; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s;
        }
        .login-box button:hover { background: transparent; color: var(--gold); border: 1px solid var(--gold); }

        #dashboard { display: none; padding: 2rem; max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(212, 175, 55, 0.3); padding-bottom: 1rem; margin-bottom: 2rem; }
        h1 { color: var(--gold); font-size: 1.6rem; text-transform: uppercase; letter-spacing: 2px; margin: 0; }
        
        .tabs { display: flex; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid #333; padding-bottom: 1rem; }
        .tab-btn { background: transparent; color: var(--text-muted); border: 1px solid #333; padding: 10px 20px; cursor: pointer; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .tab-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(212, 175, 55, 0.1); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: var(--surface-color); border: 1px solid #333; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #222; font-size: 0.9rem; }
        th { color: var(--gold); text-transform: uppercase; letter-spacing: 1px; background: #0d0d0d; font-size: 0.8rem; }
        tr:hover { background: rgba(255, 255, 255, 0.02); }
        
        button.logout-btn { background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 8px 16px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; }
        button.logout-btn:hover { background: var(--danger); color: #fff; }
        
        .badge-qty { color: #fff; background: #333; padding: 2px 6px; border-radius: 4px; font-size: 0.85rem; }
        .badge-blik { color: #fff; background: #9c27b0; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; text-transform: uppercase; }
        .badge-pobranie { color: #000; background: var(--gold); padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; text-transform: uppercase; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyC0AGUVIRudjS590eHayYQi8upP25z_8gI",
          authDomain: "peptyd-30e5f.firebaseapp.com",
          projectId: "peptyd-30e5f",
          storageBucket: "peptyd-30e5f.firebasestorage.app",
          messagingSenderId: "1043785194106",
          appId: "1:1043785194106:web:66ae7635795d4676c9b9c3",
          measurementId: "G-ZLB2C3T2MN"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadOrders();
                loadMessages();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('dashboard').style.display = 'none';
            }
        });

        window.loginCRM = function(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            btn.innerText = 'Logowanie...';
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            
            signInWithEmailAndPassword(auth, email, pass)
                .then(() => { btn.innerText = 'ZALOGUJ SIĘ'; })
                .catch(err => {
                    alert("Błąd logowania. Sprawdź e-mail i hasło.");
                    btn.innerText = 'ZALOGUJ SIĘ';
                });
        };

        window.logoutCRM = function() {
            signOut(auth);
        };

        async function loadOrders() {
            const tbody = document.getElementById('orders-body');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">Ładowanie danych...</td></tr>';
            
            try {
                const q = query(collection(db, "orders"), orderBy("date", "desc"));
                const snapshot = await getDocs(q);
                tbody.innerHTML = '';
                
                if (snapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Brak zamówień.</td></tr>';
                    return;
                }

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const date = new Date(data.date).toLocaleString('pl-PL', {day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'});
                    
                    const paymentBadge = data.payment === 'blik' 
                        ? '<span class="badge-blik">BLIK (15zł)</span>' 
                        : '<span class="badge-pobranie">Pobranie (20zł)</span>';

                    tbody.innerHTML += `
                        <tr>
                            <td style="color: var(--text-muted); font-size: 0.85rem;">${date}</td>
                            <td>
                                <strong style="color: #fff;">${data.name}</strong><br>
                                <span style="color:var(--text-muted); font-size: 0.8rem;">${data.email} | ${data.phone}</span>
                            </td>
                            <td>
                                Reta: <span class="badge-qty">${data.retatrutyd_qty}</span><br>
                                Mela: <span class="badge-qty">${data.melanotan_qty}</span>
                            </td>
                            <td style="font-weight: bold; color: var(--gold);">${data.total_amount} PLN</td>
                            <td>${paymentBadge}</td>
                            <td style="font-weight: bold; letter-spacing: 1px;">${data.paczkomat}</td>
                        </tr>
                    `;
                });
            } catch(e) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--danger);">Błąd ładowania danych.</td></tr>';
            }
        }

        async function loadMessages() {
            const tbody = document.getElementById('messages-body');
            
            try {
                const q = query(collection(db, "messages"), orderBy("date", "desc"));
                const snapshot = await getDocs(q);
                tbody.innerHTML = '';
                
                if (snapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">Brak wiadomości.</td></tr>';
                    return;
                }

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const date = new Date(data.date).toLocaleString('pl-PL', {day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'});
                    
                    tbody.innerHTML += `
                        <tr>
                            <td style="width: 150px; color: var(--text-muted); font-size: 0.85rem;">${date}</td>
                            <td style="width: 250px;">
                                <strong style="color: #fff;">${data.name}</strong><br>
                                <span style="color:var(--gold); font-size: 0.85rem;">${data.email}</span>
                            </td>
                            <td style="line-height: 1.4;">${data.message}</td>
                        </tr>
                    `;
                });
            } catch(e) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: var(--danger);">Błąd ładowania danych.</td></tr>';
            }
        }
    </script>
</head>
<body>

    <div id="login-screen">
        <form class="login-box" onsubmit="window.loginCRM(event)">
            <h2 style="color: var(--gold); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 2px;">HexaLabs CRM</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem; font-size: 0.85rem;">Autoryzowany dostęp</p>
            <input type="email" id="email" placeholder="Adres E-mail" required>
            <input type="password" id="password" placeholder="Hasło" required>
            <button type="submit" id="login-btn">Zaloguj się</button>
        </form>
    </div>

    <div id="dashboard">
        <header>
            <h1>HexaLabs Panel</h1>
            <button class="logout-btn" onclick="window.logoutCRM()">Wyloguj</button>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('orders-tab', this)">📦 Zamówienia</button>
            <button class="tab-btn" onclick="switchTab('messages-tab', this)">✉️ Wiadomości z Kontaktu</button>
        </div>

        <div id="orders-tab" class="tab-content active">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Klient & Kontakt</th>
                            <th>Produkty</th>
                            <th>Kwota</th>
                            <th>Dostawa / Płatność</th>
                            <th>Paczkomat</th>
                        </tr>
                    </thead>
                    <tbody id="orders-body"></tbody>
                </table>
            </div>
        </div>

        <div id="messages-tab" class="tab-content">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Nadawca</th>
                            <th>Treść Wiadomości</th>
                        </tr>
                    </thead>
                    <tbody id="messages-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        window.switchTab = function(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }
    </script>
</body>
</html>
