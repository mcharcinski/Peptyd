<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HexaLab - Premium Research Peptides</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --surface-color: #141414;
            --surface-light: #1e1e1e;
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --gold: #D4AF37;
            --gold-glow: rgba(212, 175, 55, 0.2);
            --gold-glow-strong: rgba(212, 175, 55, 0.4);
            --danger: #ff4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Widoki aplikacji */
        .view {
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
        }
        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Nagłówek wspólny */
        header {
            text-align: center;
            padding: 2.5rem 2rem 1.5rem;
            background: linear-gradient(180deg, var(--surface-color) 0%, var(--bg-color) 100%);
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 0.2rem;
        }

        .hexagon {
            width: 30px;
            height: 35px;
            background-color: transparent;
            border: 2px solid var(--gold);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px var(--gold-glow);
        }

        h1 {
            color: var(--gold);
            font-size: 1.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 300;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.75rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Koszyk Ikona w Headerze */
        .cart-icon-btn {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gold);
            cursor: pointer;
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .cart-icon-btn:hover {
            filter: drop-shadow(0 0 8px var(--gold-glow-strong));
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background-color: var(--gold);
            color: var(--bg-color);
            font-size: 0.75rem;
            font-weight: bold;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg-color);
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        /* Sekcja Gwarancji (Home) */
        .guarantee-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3.5rem;
        }

        .guarantee-card {
            background: var(--surface-color);
            padding: 1.5rem;
            border: 1px solid rgba(212, 175, 55, 0.2);
            text-align: center;
            border-radius: 4px;
            transition: transform 0.3s;
        }

        .guarantee-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px var(--gold-glow);
        }

        .guarantee-icon {
            font-size: 2rem;
            color: var(--gold);
            margin-bottom: 1rem;
        }

        .guarantee-title {
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .guarantee-text {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Siatka produktów (Home) */
        .section-title {
            text-align: center;
            color: var(--gold);
            font-size: 1.8rem;
            margin-bottom: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 300;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: linear-gradient(145deg, var(--surface-light) 0%, var(--surface-color) 100%);
            border: 1px solid rgba(212, 175, 55, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-align: center;
            padding: 2.5rem 1.5rem;
        }

        .product-card:hover {
            box-shadow: 0 0 25px var(--gold-glow-strong);
            border-color: var(--gold);
        }

        .product-card h3 {
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        .price-tag {
            color: #fff;
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 1.2rem;
        }

        .price-tag span {
            color: var(--gold);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .product-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .btn-view {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--gold);
            padding: 10px 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }
        
        .btn-view:hover {
            background: var(--gold);
            color: var(--bg-color);
        }

        /* Widok Produktu */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2rem;
            transition: color 0.3s;
        }
        .back-btn:hover { color: var(--gold); }

        .product-details-container {
            background: var(--surface-color);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 3rem 2rem;
        }

        .product-header {
            text-align: center;
            margin-bottom: 2.5rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        }

        .product-header h2 {
            font-size: 2.2rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
        }

        .product-header .detail-price {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 1.2rem;
        }

        .product-header .detail-price span {
            color: var(--gold);
            font-size: 1.2rem;
        }

        .lab-badge {
            display: inline-block;
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold);
            padding: 5px 15px;
            border: 1px solid var(--gold);
            border-radius: 20px;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .description-box {
            color: var(--text-main);
            font-size: 1rem;
            line-height: 1.8;
            margin-bottom: 3rem;
            text-align: justify;
        }

        .kit-section {
            background: var(--surface-light);
            padding: 2rem;
            border-left: 3px solid var(--gold);
            margin-bottom: 3rem;
        }

        .kit-section h4 {
            color: var(--gold);
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .kit-list {
            list-style: none;
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .kit-list li {
            position: relative;
            padding-left: 30px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .kit-list li::before {
            content: '✓';
            position: absolute;
            left: 0;
            top: 0;
            color: var(--gold);
            font-weight: bold;
        }

        button.btn-primary {
            background: var(--gold);
            color: var(--bg-color);
            border: 1px solid var(--gold);
            padding: 15px 40px;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        button.btn-primary:hover {
            background: transparent;
            color: var(--gold);
            box-shadow: 0 0 20px var(--gold-glow);
        }

        /* Widok Koszyka / Kasy */
        .cart-container {
            background: var(--surface-color);
            padding: 2rem;
            border: 1px solid rgba(212, 175, 55, 0.15);
            margin-bottom: 2rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        }

        .cart-item-info strong {
            display: block;
            color: var(--gold);
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .cart-item-info span {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border: 1px solid #333;
        }

        .cart-item-qty button {
            background: none;
            border: none;
            color: var(--gold);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 5px;
        }

        .cart-item-total {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .total-box {
            text-align: right;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            font-size: 1.2rem;
            color: var(--text-muted);
        }
        
        .total-box strong {
            color: #fff;
            font-size: 1.8rem;
            margin-left: 10px;
        }
        
        .total-box span {
            color: var(--gold);
            font-size: 1.2rem;
            font-weight: bold;
        }

        .checkout-form {
            background: var(--surface-light);
            padding: 2.5rem;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }

        .form-group { margin-bottom: 1.5rem; }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            color: var(--text-main);
            font-size: 1rem;
            transition: border-color 0.3s;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 8px var(--gold-glow);
        }

        /* Powiadomienie Toast */
        .toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--gold);
            color: var(--bg-color);
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            box-shadow: 0 5px 15px var(--gold-glow-strong);
            transition: bottom 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 2000;
        }
        .toast.show {
            bottom: 30px;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 3000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--surface-color);
            padding: 3rem;
            max-width: 500px;
            width: 90%;
            text-align: center;
            border: 1px solid var(--gold);
            box-shadow: 0 0 30px var(--gold-glow);
        }

        .blik-box {
            background: #000;
            padding: 1.5rem;
            margin: 1.5rem 0;
            border: 1px dashed var(--gold);
            font-size: 1.4rem;
            letter-spacing: 3px;
            color: var(--gold);
        }

        @media (min-width: 768px) {
            .kit-list { grid-template-columns: 1fr 1fr; }
            .cart-item { flex-direction: row; }
        }
        @media (max-width: 767px) {
            .cart-item { flex-direction: column; align-items: flex-start; gap: 10px; }
            .cart-item-total { align-self: flex-end; }
        }
    </style>

    <script>
        const products = {
            'retatrutyd': {
                name: 'Retatrutyd 10mg',
                price: 350,
                desc: 'Jeden z najbardziej zaawansowanych peptydów badawczych dostępnych na rynku. Potrójny agonista receptorów, zaprojektowany z myślą o maksymalnej optymalizacji procesów metabolicznych w środowisku laboratoryjnym. Preparat charakteryzuje się wyjątkową stabilnością strukturalną i ekstremalną czystością, co czyni go idealnym wyborem do zaawansowanych badań in vitro.',
            },
            'melanotan': {
                name: 'Melanotan MT-2',
                price: 90,
                desc: 'Wysokoskoncentrowany analog hormonu stymulującego alfa-melanocyty (α-MSH). Syntetyczny peptyd badawczy opracowany w celu analizy procesów melanogenezy. W badaniach laboratoryjnych wykazuje silne powinowactwo do receptorów melanokortynowych. Produkt poddawany wieloetapowej liofilizacji, gwarantującej pełną integralność łańcucha peptydowego.'
            }
        };

        // Stan koszyka
        let cart = {
            'retatrutyd': 0,
            'melanotan': 0
        };
        let currentProductId = null;

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goToHome() {
            showView('view-home');
        }

        function openProduct(productId) {
            currentProductId = productId;
            const prod = products[productId];
            document.getElementById('detail-title').innerText = prod.name;
            document.getElementById('detail-price').innerHTML = prod.price + ' <span>PLN</span>';
            document.getElementById('detail-desc').innerText = prod.desc;
            showView('view-product');
        }

        function addToCart() {
            if (currentProductId) {
                cart[currentProductId]++;
                updateCartBadge();
                showToast("Dodano do koszyka");
            }
        }

        function updateCartBadge() {
            const totalItems = cart.retatrutyd + cart.melanotan;
            const badge = document.getElementById('cart-badge');
            badge.innerText = totalItems;
            
            if(totalItems > 0) {
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toastMsg');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function openCart() {
            renderCart();
            showView('view-cart');
        }

        function updateQty(productId, delta) {
            if (cart[productId] + delta >= 0) {
                cart[productId] += delta;
                updateCartBadge();
                renderCart();
            }
        }

        function renderCart() {
            const itemsContainer = document.getElementById('cart-items');
            const checkoutForm = document.getElementById('checkout-form');
            const totalAmountSpan = document.getElementById('cart-total-amount');
            
            itemsContainer.innerHTML = '';
            let total = 0;
            let totalItems = cart.retatrutyd + cart.melanotan;

            if (totalItems === 0) {
                itemsContainer.innerHTML = '<p style="text-align:center; color: var(--text-muted); margin: 2rem 0;">Twój koszyk jest pusty.</p>';
                checkoutForm.style.display = 'none';
                totalAmountSpan.innerText = '0';
                return;
            }

            checkoutForm.style.display = 'block';

            for (let [id, qty] of Object.entries(cart)) {
                if (qty > 0) {
                    const prod = products[id];
                    const itemTotal = qty * prod.price;
                    total += itemTotal;
                    
                    itemsContainer.innerHTML += `
                        <div class="cart-item">
                            <div class="cart-item-info">
                                <strong>${prod.name}</strong>
                                <span>${prod.price} PLN / szt.</span>
                            </div>
                            <div class="cart-item-qty">
                                <button type="button" onclick="updateQty('${id}', -1)">-</button>
                                <span style="min-width: 20px; text-align: center;">${qty}</span>
                                <button type="button" onclick="updateQty('${id}', 1)">+</button>
                            </div>
                            <div class="cart-item-total">${itemTotal} PLN</div>
                        </div>
